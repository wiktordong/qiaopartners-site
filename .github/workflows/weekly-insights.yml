name: Weekly Insights release
# Rebuilds the site every Monday morning (Warsaw) so the next scheduled article goes live in all four languages.
# Release dates live in _src/insights/build_insights.py (RELEASE).
on:
  schedule:
    - cron: "5 5 * * 1"   # Mondays 05:05 UTC = 06:05 Warsaw in winter (07:05 in summer)
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: python3 _src/build.py
      - name: Commit and publish if a new article is due
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Weekly Insights release $(date -u +%F)"
            git push
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
          else
            echo "No new article this week."
          fi
